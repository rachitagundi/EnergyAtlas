name: Checkpoint checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checkpoint:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-py312.txt
      - name: Install constrained checkpoint dependencies
        run: python -m pip install -r requirements.txt -c constraints-py312.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run contract checks
        run: python -m unittest discover -s tests -v
      - name: Run model-double checkpoint
        run: python checkpoint.py
