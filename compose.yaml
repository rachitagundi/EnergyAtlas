# Local learning only. Public development credentials; never reuse in production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energyatlas
      POSTGRES_USER: energyatlas
      POSTGRES_PASSWORD: local_learning_only
    volumes:
      - energyatlas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energyatlas -d energyatlas"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://energyatlas:local_learning_only@db:5432/energyatlas
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      db:
        condition: service_healthy
volumes:
  energyatlas_pg:
